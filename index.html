<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>ومضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Naskh+Arabic:wght@400;600&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* One idea per screen, snap-scrolled; reading text set in Naskh, UI in Readex; each domain tints its card */
:root{
  --bg:#0e0f14; --fg:#f1ede4; --dim:rgba(241,237,228,.62); --faint:rgba(241,237,228,.14);
  --panel:#171922; --chip:rgba(255,255,255,.08);
  --ui:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  --cover:"DM Serif Display",Georgia,"Times New Roman",serif;
  --read:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  color-scheme:dark; box-sizing:border-box; height:100%;
}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto}
.top{position:absolute;inset-inline:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 40px;background:linear-gradient(var(--bg) 82%,transparent)}
/* Reading goals: three segments fill while you read (session goal), plus today's count toward 9 */
.goals{position:absolute;top:52px;padding-block:4px 10px;background:var(--bg);box-shadow:0 10px 12px var(--bg);inset-inline:16px;z-index:6;display:flex;align-items:center;gap:12px;pointer-events:none}
.seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.seg i{position:relative;height:4px;border-radius:2px;background:var(--faint);overflow:hidden}
.seg i b{position:absolute;inset:0;background:#f5c451;border-radius:2px;opacity:0;transition:opacity .35s}
.seg i b.on{opacity:1}
/* Full-screen congratulation after each 3 ideas; swipe up or tap to carry on */
.done{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;text-align:center;background:radial-gradient(90% 60% at 50% 40%,#2a2410,var(--bg) 75%);animation:fadein .35s ease-out}
.done.day{background:radial-gradient(90% 60% at 50% 40%,#123222,var(--bg) 75%)}
.done .mark{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#f5c451;box-shadow:0 0 0 12px rgba(245,196,81,.15),0 0 40px rgba(245,196,81,.35)}
.done.day .mark{background:#7fd69b;box-shadow:0 0 0 12px rgba(127,214,155,.15),0 0 40px rgba(127,214,155,.35)}
.done .mark svg{width:46px;height:46px;fill:none;stroke:#14120a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h3{margin:8px 0 0;font-size:26px;font-weight:700}
.done p{margin:0;color:var(--dim);font-size:15px;line-height:1.7}
.done button{margin-top:18px;padding:12px 26px;border-radius:24px;background:var(--chip);border:1px solid var(--faint);font-weight:600;font-size:15px}
.done small{color:var(--dim);font-size:12px}
.done .cont{margin-top:16px;font-size:16px;font-weight:600;color:var(--fg)}
@keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.done{animation:none}}
.goals.win .seg i b{background:#7fd69b}
.day{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.day svg{width:16px;height:16px;transform:rotate(-90deg)}
.day.win{color:#7fd69b}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.brand i{width:10px;height:10px;border-radius:50%;background:#f5c451;box-shadow:0 0 12px #f5c451}
.tools{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding-inline:12px;border-radius:17px;background:var(--chip);border:1px solid var(--faint);font-size:13px;font-weight:600}
.pill svg{width:16px;height:16px}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior-y:contain;scroll-snap-align:start;scroll-snap-stop:always;
  background:radial-gradient(120% 60% at 50% 0%,hsl(var(--h) 45% 20%),var(--bg) 70%)}
.card::-webkit-scrollbar{display:none}
/* Each reel scrolls inside itself: there is always room to lift the cover away so the title sits at the top */
.page{min-height:calc(100% + clamp(170px,30vh,250px) + clamp(10px,2vh,18px));display:flex;flex-direction:column;padding:80px 20px 20px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.inner{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(10px,2vh,18px)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.chip{padding:5px 12px;border-radius:14px;font-weight:600;color:hsl(var(--h) 85% 78%);background:hsl(var(--h) 45% 22% / .9);border:1px solid hsl(var(--h) 60% 50% / .35)}
.time{color:var(--dim);font-variant-numeric:tabular-nums}
h2{margin:0;font-size:clamp(22px,3.4vh,30px);line-height:1.35;font-weight:700;text-wrap:balance}
.text{display:flex;flex-direction:column;gap:.7em;font-family:var(--read);font-size:clamp(15.5px,2.35vh,19px);line-height:1.9;color:var(--fg)}
/* Cover: a generated book jacket per title — spine on the left, a motif from the book's id, title and author set large */
.cover{position:relative;flex:none;height:clamp(170px,30vh,250px);border-radius:14px;overflow:hidden;isolation:isolate;
  background:linear-gradient(150deg,hsl(var(--h) 50% 30%),hsl(calc(var(--h) + 25) 45% 14%));box-shadow:0 14px 30px rgba(0,0,0,.35)}
.cover svg.motif{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.cover::before{content:"";position:absolute;inset-block:0;left:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 70%,rgba(255,255,255,.08))}
.cover .ctop{position:absolute;top:12px;inset-inline:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cover .chip{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.18);color:#f1ede4}
.cover .time{color:rgba(241,237,228,.8)}
.cover .ctext{position:absolute;left:30px;right:18px;bottom:16px;direction:ltr;text-align:left;display:flex;flex-direction:column;gap:6px}
.cover .en{font-family:var(--cover);font-weight:400;font-size:clamp(24px,4vh,34px);line-height:1.08;color:#fbf7ee;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.cover .au{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--h) 80% 82%)}
.book{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding-top:clamp(10px,1.8vh,16px);border-top:1px solid var(--faint);font-size:13px}
.book svg{grid-row:span 3;width:22px;height:22px;stroke:hsl(var(--h) 80% 72%);fill:none;stroke-width:1.6;margin-top:2px}
.book b{font-size:14px}
.book .en,.book .au{direction:ltr;unicode-bidi:plaintext;text-align:right}
.book .au{color:var(--dim)}
.text p{margin:0;white-space:pre-line}
.book .dom{color:var(--dim)}
/* Optional listening: one tap reads the idea aloud; the paragraph being read is lit */
.listen{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;color:hsl(var(--h) 85% 80%);background:hsl(var(--h) 45% 22% / .7);border:1px solid hsl(var(--h) 60% 55% / .35)}
.listen svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.listen.on{background:hsl(var(--h) 55% 40%);color:#fbf7ee}
.text.speaking p{opacity:.45;transition:opacity .3s}.text.speaking p.now{opacity:1}
.day .ok{display:none;width:14px;height:14px;fill:none;stroke:#7fd69b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.day.complete svg:first-child{display:none}.day.complete .ok{display:block}
.done .end{background:transparent;border:0;color:var(--dim);font-weight:400;font-size:13px;margin-top:0;padding:8px 14px;text-decoration:underline;text-underline-offset:4px}
.bye{position:absolute;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center;background:var(--bg)}
.bye h3{margin:0;font-size:22px}.bye p{margin:0;color:var(--dim);font-size:14px;line-height:1.7}
.acts{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.act{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);padding:8px 4px}
.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.act.on{color:#f5c451}.act.on svg{fill:#f5c451;stroke:#f5c451}
.hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:6;padding:9px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--faint);font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.toast{position:absolute;left:50%;top:76px;white-space:nowrap;transform:translateX(-50%);z-index:7;padding:8px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--faint);font-size:13px;pointer-events:none}
.scrim{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.5)}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:9;max-height:80%;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--faint);font-weight:600}
.sheet header button{font-size:24px;width:32px;height:32px;line-height:1}
.list{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column}
.item{border-bottom:1px solid var(--faint)}
.item summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;flex-direction:column;gap:3px}
.item summary::-webkit-details-marker{display:none}
.item summary b{font-size:15px}
.item summary span{font-size:12px;color:var(--dim)}
.item p{margin:0 0 14px;font-family:var(--read);font-size:16px;line-height:1.85}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:28px 0;line-height:1.7}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>

</head>
<body>
<div class="app" dir="rtl">
  <div class="top">
    <div class="brand"><i></i>ومضة</div>
    <div class="tools">
      <button class="pill" id="open-saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>المحفوظات</button>
    </div>
  </div>
  <div class="goals" id="goals" aria-label="أهداف القراءة"><div class="seg" id="seg"><i><b></b></i><i><b></b></i><i><b></b></i></div><span class="day" id="day"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="rgba(241,237,228,.14)" stroke-width="3"/><circle id="ring" cx="10" cy="10" r="8" fill="none" stroke="#f5c451" stroke-width="3" stroke-linecap="round" stroke-dasharray="50.27" stroke-dashoffset="50.27"/></svg><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="daytxt"></span></span></div>
  <section class="done" id="done" hidden role="dialog" aria-live="polite"><span class="mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><h3></h3><p></p><small class="cont">اسحب للأعلى لتكمل</small><button class="end">أو اضغط هنا للإنهاء</button></section>
  <section class="bye" id="bye" hidden><h3>إلى اللقاء</h3><p>انتهت جلستك. يمكنك إغلاق التطبيق الآن.</p></section>
  <main class="feed" id="feed" aria-label="الأفكار"></main>
  <div class="hint" id="hint">اسحب لأعلى للفكرة التالية</div>
  <div class="toast" id="toast" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="الأفكار المحفوظة">
    <header><span id="sheet-title">المحفوظات</span><button id="close" aria-label="إغلاق">×</button></header>
    <div class="list" id="list"></div>
  </section>
</div>

<script src="ideas.js"></script>
<script>

const BOOK_ICON='<svg viewBox="0 0 24 24"><path d="M3 5.5c3-1.3 6-1.3 9 .8 3-2.1 6-2.1 9-.8v13c-3-1.3-6-1.3-9 .8-3-2.1-6-2.1-9-.8z"/><path d="M12 6.3v13"/></svg>';
const SAVE_ICON='<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>';
const COPY_ICON='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';
const AR=n=>n.toLocaleString('ar-EG');
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
const EAR_SVG='<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6" rx="1.5"/></svg>';
const byId=Object.fromEntries(IDEAS.map(i=>[i.id,i]));

let queue=[],saved=[];
try{queue=JSON.parse(localStorage.getItem('wamda-queue')||'[]').filter(id=>byId[id])}catch(e){}
try{saved=JSON.parse(localStorage.getItem('wamda-saved')||'[]').filter(id=>byId[id])}catch(e){}
const store=()=>{try{localStorage.setItem('wamda-queue',JSON.stringify(queue));localStorage.setItem('wamda-saved',JSON.stringify(saved))}catch(e){}};

/* الترتيب: لم يُشاهَد أولًا، ولا يأتي مجال (ولا كتاب) مرتين متتاليتين متى أمكن */
let lastD=-1,lastB='';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function arrange(list){const pool=shuffle(list.slice()),out=[];
  while(pool.length){let k=pool.findIndex(i=>i.d!==lastD&&i.en!==lastB);if(k<0)k=pool.findIndex(i=>i.en!==lastB);if(k<0)k=0;
    const it=pool.splice(k,1)[0];out.push(it);lastD=it.d;lastB=it.en}return out}
/* دائرة: الأفكار في طابور ثابت. أي فكرة تشاهدها تنتقل إلى آخر الطابور،
   فتبدأ كل مرة من فكرة لم تشاهدها، وبعد آخر فكرة تبدأ الدورة من جديد دون توقف. */
(function(){const inQ=new Set(queue),fresh=IDEAS.filter(i=>!inQ.has(i.id));
  if(fresh.length){queue=arrange(fresh).map(i=>i.id).concat(queue);store()}})();
const ring=queue.slice();let ringPos=0;
function nextRound(){const out=[];for(let k=0;k<ring.length;k++)out.push(byId[ring[(ringPos+k)%ring.length]]);return out}
function markSeen(id){const k=queue.indexOf(id);if(k<0)return;queue.splice(k,1);queue.push(id);store()}

const feed=document.getElementById('feed');let rendered=0;
function readTime(x){return x.split(/\s+/).length/140<1.5?'قراءة دقيقة':'قراءة دقيقتين'}
function card(it){
  const D=DOMAINS[it.d],el=document.createElement('article');el.className='card';el.style.setProperty('--h',D.hue);el.dataset.id=it.id;el.dataset.n=rendered++;
  el.innerHTML=`<div class="page"><div class="inner">
    <div class="cover">${motif(it)}<img alt="" loading="lazy" src="covers/${it.id.replace(/-\d+$/,'')}.jpg" onerror="this.remove()"><div class="ctop"><span class="chip"></span><span class="time"></span></div>
      <div class="ctext"><b class="en"></b><span class="au"></span></div></div>
    <h2></h2><div class="text"></div>
  </div>
  <div class="acts">
    <button class="act save" aria-pressed="false">${SAVE_ICON}<span>حفظ</span></button>
    <button class="listen" hidden>${EAR_SVG}<span>استمع</span></button>
    <button class="act copy">${COPY_ICON}<span>نسخ</span></button>
  </div></div>`;
  el.querySelector('.chip').textContent=D.name;
  el.querySelector('.time').textContent=readTime(it.x);
  el.querySelector('h2').textContent=it.t;
  const tx=el.querySelector('.text');it.x.split('\n\n').forEach(par=>{const p=document.createElement('p');p.textContent=par;tx.append(p)});
  const lb=el.querySelector('.listen');if(hasTTS){lb.hidden=false;lb.onclick=()=>toggleListen(el,it)}
  wire(el,it);io.observe(el);return el}
function motif(it){let h=0;for(const c of it.id)h=(h*31+c.charCodeAt(0))>>>0;
  const r=n=>{h=(h*1103515245+12345)>>>0;return (h>>>8)%n},kind=r(4),col='rgba(255,255,255,';let s='';
  if(kind===0){const cx=200+r(160),cy=40+r(60);for(let i=1;i<=7;i++)s+=`<circle cx="${cx}" cy="${cy}" r="${i*26}" fill="none" stroke="${col}${.16-i*.016})" stroke-width="2"/>`}
  else if(kind===1){for(let i=-4;i<14;i++)s+=`<path d="M${i*34} 0 L${i*34+180} 250" stroke="${col}${i%3?.06:.14})" stroke-width="${i%3?10:3}"/>`}
  else if(kind===2){for(let y=0;y<6;y++)for(let x=0;x<11;x++)s+=`<circle cx="${30+x*36}" cy="${18+y*24}" r="${x+y>r(8)+4?2.4:1.2}" fill="${col}.18)"/>`}
  else{const y=60+r(50);s=`<circle cx="${300+r(60)}" cy="${y}" r="${90+r(40)}" fill="${col}.07)"/><rect x="0" y="${y+30}" width="400" height="2" fill="${col}.18)"/>`}
  return `<svg class="motif" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`}
function wire(el,it){const D=DOMAINS[it.d];
  el.querySelector('.en').textContent=it.en;el.querySelector('.au').textContent=it.a;
  const sb=el.querySelector('.save');paintSave(sb,it.id);
  sb.onclick=()=>{const k=saved.indexOf(it.id);k<0?saved.unshift(it.id):saved.splice(k,1);store();
    document.querySelectorAll(`.card[data-id="${it.id}"] .save`).forEach(b=>paintSave(b,it.id));toast(k<0?'حُفظت الفكرة':'أُزيلت من المحفوظات')};
  el.querySelector('.copy').onclick=()=>{const s=`${it.t}\n\n${it.x}\n\n${it.en} — ${it.a}\nالمجال: ${D.name}`;
    try{navigator.clipboard.writeText(s).then(()=>toast('نُسخ النص'),()=>toast('تعذّر النسخ'))}catch(e){toast('تعذّر النسخ')}}}
function paintSave(b,id){const on=saved.includes(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?'محفوظة':'حفظ'}
function appendRound(){const f=document.createDocumentFragment();nextRound().forEach(it=>f.append(card(it)));feed.append(f)}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;
  markSeen(e.target.dataset.id);if(speaking&&speaking!==e.target)stopListen();document.querySelectorAll('.card').forEach(c=>{if(c!==e.target&&c.scrollTop)c.scrollTop=0});
  if(+e.target.dataset.n>=rendered-3)appendRound()}),{rootMargin:'-50% 0px -50% 0px'});

/* الانتقال بين الريلز: الريل يتحرك من الداخل أولًا، وحين تصل إلى آخره (أو أوله) تنقلك السحبة التالية للريل المجاور */
function cardAt(){return feed.children[Math.round(feed.scrollTop/feed.clientHeight)]}
function go(dir,skip){if(!doneEl.hidden)return;if(dir>0&&!skip&&!beforeNext())return;const i=Math.round(feed.scrollTop/feed.clientHeight)+dir;if(i<0)return;feed.scrollTo({top:i*feed.clientHeight,behavior:'smooth'})}
const edge=c=>({top:c.scrollTop<=2,bottom:c.scrollTop+c.clientHeight>=c.scrollHeight-2});
let sy=0,sx=0,startEdge=null,startCard=null;
feed.addEventListener('touchstart',e=>{const t=e.touches[0];sy=t.clientY;sx=t.clientX;startCard=cardAt();startEdge=startCard?edge(startCard):null},{passive:true});
feed.addEventListener('touchend',e=>{if(!startEdge)return;const t=e.changedTouches[0],dy=t.clientY-sy,dx=t.clientX-sx;
  if(Math.abs(dy)<45||Math.abs(dx)>Math.abs(dy))return;
  if(dy<0&&startEdge.bottom)go(1);else if(dy>0&&startEdge.top)go(-1)},{passive:true});
let wheelLock=0;
feed.addEventListener('wheel',e=>{const c=cardAt();if(!c||Math.abs(e.deltaY)<8)return;const ed=edge(c),now=Date.now();
  if((e.deltaY>0&&ed.bottom)||(e.deltaY<0&&ed.top)){e.preventDefault();if(now>wheelLock){wheelLock=now+700;go(e.deltaY>0?1:-1)}}},{passive:false});

let tt;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

/* المحفوظات */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),list=document.getElementById('list');
function openSaved(){list.innerHTML='';
  document.getElementById('sheet-title').textContent='المحفوظات ('+AR(saved.length)+')';
  if(!saved.length)list.innerHTML='<div class="empty">لم تحفظ أي فكرة بعد.<br>اضغط «حفظ» أسفل أي فكرة لتجدها هنا.</div>';
  saved.forEach(id=>{const it=byId[id],d=document.createElement('details');d.className='item';
    d.innerHTML='<summary><b></b><span></span></summary><p></p>';
    d.querySelector('b').textContent=it.t;d.querySelector('span').textContent=it.en+' — '+it.a+' · '+DOMAINS[it.d].name;d.querySelector('span').dir='auto';d.querySelector('p').textContent=it.x;list.append(d)});
  sheet.hidden=scrim.hidden=false}
const closeSaved=()=>{sheet.hidden=scrim.hidden=true};
document.getElementById('open-saved').onclick=openSaved;document.getElementById('close').onclick=closeSaved;scrim.onclick=closeSaved;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeSaved();closeDone(false)}
  if(sheet.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();go(e.key==='ArrowDown'?1:-1)}});

/* أهداف القراءة: الفكرة تُحسب مقروءة حين تنتقل منها إلى الفكرة التالية.
   كل 3 أفكار = هدف جلسة، وبعدها شاشة تهنئة توقف الانتقال حتى تسحب مرة أخرى. و9 أفكار في اليوم = الهدف اليومي. */
const SESSION_GOAL=3,DAILY_GOAL=9,CYCLE=16*60*60*1000;
/* "اليوم" هنا دورة مدتها 16 ساعة تبدأ مع أول فكرة تقرأها، ثم يبدأ العدّ من جديد */
const fresh=()=>({start:0,ids:[]});
let daily=fresh();try{const s=JSON.parse(localStorage.getItem('wamda-daily')||'null');if(s&&s.start&&Array.isArray(s.ids))daily=s}catch(e){}
function rollover(){if(daily.start&&Date.now()-daily.start>=CYCLE)daily=fresh()}
const dayDone=()=>daily.ids.length>=DAILY_GOAL;
let sessionCount=0,hiddenAt=0;
const segs=[...document.querySelectorAll('#seg b')],goalRing=document.getElementById('ring'),dayEl=document.getElementById('day'),dayTxt=document.getElementById('daytxt'),goalsEl=document.getElementById('goals');
const doneEl=document.getElementById('done'),byeEl=document.getElementById('bye');
function paintGoals(){rollover();const d=daily.ids.length,full=dayDone();
  segs.forEach((b,k)=>b.classList.toggle('on',full||k<sessionCount));goalsEl.classList.toggle('win',full||sessionCount>=SESSION_GOAL);
  goalRing.style.strokeDashoffset=50.27*(1-Math.min(d/DAILY_GOAL,1));
  dayEl.classList.toggle('win',full);dayEl.classList.toggle('complete',full);
  dayTxt.textContent=full?'اكتمل هدف اليوم':'اليوم '+AR(d)+' من '+AR(DAILY_GOAL)}
/* يُستدعى قبل الانتقال للفكرة التالية؛ يرجع false إذا ظهرت شاشة التهنئة بدل الانتقال */
function beforeNext(){rollover();if(dayDone())return true;
  const c=cardAt();if(!c)return true;const id=c.dataset.id;if(daily.ids.includes(id))return true;
  if(!daily.start)daily.start=Date.now();
  daily.ids.push(id);try{localStorage.setItem('wamda-daily',JSON.stringify(daily))}catch(e){}
  sessionCount++;paintGoals();
  if(dayDone()){showDone(true);return false}
  if(sessionCount>=SESSION_GOAL){showDone(false);return false}
  return true}
function showDone(day){const n=daily.ids.length;stopListen();
  doneEl.querySelector('h3').textContent=day?'أنهيت هدفك اليومي':'أنهيت هدف هذه الجلسة';
  doneEl.querySelector('p').textContent=day?'قرأت '+AR(n)+' أفكار. نهاية جلسة اليوم.':'قرأت '+AR(SESSION_GOAL)+' أفكار. اليوم: '+AR(n)+' من '+AR(DAILY_GOAL);
  doneEl.classList.toggle('day',day);doneEl.hidden=false}
function closeDone(move){if(doneEl.hidden)return;doneEl.hidden=true;sessionCount=0;paintGoals();if(move)go(1,true)}
/* زر الإنهاء: يغلق التطبيق إن سمح الجهاز، وإلا يعرض شاشة وداع */
doneEl.querySelector('.end').onclick=()=>{doneEl.hidden=true;sessionCount=0;paintGoals();go(1,true);
  try{window.close()}catch(e){}setTimeout(()=>{byeEl.hidden=false},250)};
byeEl.onclick=()=>{byeEl.hidden=true};
let dsy=0;doneEl.addEventListener('touchstart',e=>{dsy=e.touches[0].clientY},{passive:true});
doneEl.addEventListener('touchend',e=>{if(dsy-e.changedTouches[0].clientY>45)closeDone(true)},{passive:true});
doneEl.addEventListener('wheel',e=>{e.preventDefault();if(e.deltaY>8)closeDone(true)},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();stopListen()}
  else{byeEl.hidden=true;if(hiddenAt&&Date.now()-hiddenAt>30*60*1000&&doneEl.hidden)sessionCount=0;paintGoals()}});
setInterval(paintGoals,60000);
paintGoals();

/* الاستماع عند الطلب */
let speaking=null,speakGen=0,arVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(x=>/^ar/i.test(x.lang)&&/google/i.test(x.name))||vs.find(x=>/^ar/i.test(x.lang))||null}catch(e){}}
if(hasTTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function stopListen(){speakGen++;try{hasTTS&&speechSynthesis.cancel()}catch(e){}
  if(speaking){speaking.querySelector('.text').classList.remove('speaking');speaking.querySelectorAll('.text p').forEach(p=>p.classList.remove('now'));
    const b=speaking.querySelector('.listen');b.classList.remove('on');b.querySelector('span').textContent='استمع';speaking=null}}
function toggleListen(el,it){if(speaking===el){stopListen();return}stopListen();
  const gen=speakGen,ps=[...el.querySelectorAll('.text p')],parts=[];
  parts.push({p:-1,s:it.t+'.'});
  ps.forEach((p,k)=>(p.textContent.match(/[^.؟!]+[.؟!]*/g)||[]).forEach(s=>{s=s.trim();if(s)parts.push({p:k,s})}));
  speaking=el;el.querySelector('.text').classList.add('speaking');const b=el.querySelector('.listen');b.classList.add('on');b.querySelector('span').textContent='إيقاف';
  let i=0;const next=()=>{if(gen!==speakGen)return;if(i>=parts.length){stopListen();return}
    const part=parts[i++];ps.forEach((p,k)=>p.classList.toggle('now',k===part.p||part.p<0&&k===0));
    const u=new SpeechSynthesisUtterance(part.s);u.lang=arVoice?arVoice.lang:'ar-SA';if(arVoice)u.voice=arVoice;u.rate=.95;
    u.onend=()=>next();u.onerror=e=>{if(gen===speakGen&&e.error!=='interrupted'&&e.error!=='canceled'){toast('تعذّر تشغيل الصوت. تأكد أن صوت الوسائط مرتفع');stopListen()}};
    speechSynthesis.speak(u)};
  setTimeout(next,60)}

appendRound();
setTimeout(()=>{document.getElementById('hint').style.opacity=0},3500);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
